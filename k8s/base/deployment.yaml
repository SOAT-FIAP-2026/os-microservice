apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-microservice
  namespace: techchallenge
  labels:
    app.kubernetes.io/name: os-microservice
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: techchallenge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: os-microservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: os-microservice
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: techchallenge
    spec:
      containers:
        - name: os-microservice
          image: ghcr.io/soat-fiap-2026/os-microservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: os-microservice-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: os-microservice-secrets
                  key: jwt-secret
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/ordens-servico/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ordens-servico/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: false

